name: CI

# No push-to-main trigger: the "Protect main" ruleset allows squash merges only and
# requires branches to be up to date with passing checks, so main's tree is exactly
# what the PR tested. Restore `push: branches: [main]` if that rule is relaxed.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu carries the Python-version dimension. Windows runs at the requires-python
        # floor to exercise cwd and workspace containment (server._resolve_cwd,
        # claude_policy._inside_workspace) against real nt path semantics.
        # Move the Windows pin when requires-python leaves 3.12.
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest -v

  # Its own check, not a matrix step, so changing the Python matrix cannot orphan the gate.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # test (ubuntu-latest, 3.12) builds the same cache key and is its sole saver.
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
          save-cache: "false"
      - name: Run tests with coverage
        run: uv run pytest --cov=nexus_mcp --cov-report=term-missing --cov-report=xml
      - name: Check diff coverage
        uses: j7an/shared-workflows/actions/coverage@a93150a711d06975d9da4460ffc039d83068791e # v4.8.1
        with:
          report-path: coverage.xml
          diff-cover-path: ${{ github.workspace }}/.venv/bin/diff-cover
          base-sha: ${{ github.event.pull_request.base.sha }}
          minimum: "90"
          source-paths: src/nexus_mcp/
          exclude-paths: src/nexus_mcp/__main__.py

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # test (ubuntu-latest, 3.13) builds the same cache key and is its sole saver.
      - uses: ./.github/actions/setup-uv
        with:
          save-cache: "false"
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # test (ubuntu-latest, 3.13) builds the same cache key and is its sole saver.
      - uses: ./.github/actions/setup-uv
        with:
          save-cache: "false"
      - name: Mypy
        run: uv run mypy src/nexus_mcp

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          # deny-licenses is deprecated upstream (actions/dependency-review-action#938) but
          # still functional in v5.0.0. Identifiers use ClearlyDefined's short SPDX forms
          # (the action's own examples use GPL-3.0 / LGPL-2.0). Revisit if removed in a future major.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
