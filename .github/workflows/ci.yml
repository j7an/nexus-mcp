name: CI

# No push-to-main trigger: the "Protect main" ruleset allows squash merges only and
# requires branches to be up to date with passing checks, so main's tree is exactly
# what the PR tested. Restore `push: branches: [main]` if that rule is relaxed.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu carries the Python-version dimension; Windows carries the platform
        # dimension, pinned to the requires-python floor because the nt code paths are
        # version-independent and the floor is the least-tested real configuration.
        # Move the Windows pin when requires-python leaves 3.12.
        #
        # macOS is deliberately absent. Every `sys.platform == "darwin"` branch in src/
        # is monkeypatch-tested (tests/unit/jobs/test_paths.py, test_configuration.py),
        # so ubuntu already executes it; everything else darwin does is the shared
        # `os.name == "posix"` path; and the one darwin-real test (sandbox-exec, in
        # tests/integration/test_claude_agent_smoke.py) is integration-marked, which the
        # step below excludes. Windows is not redundant that way: it is the only runner
        # that reaches _terminate_windows_tree() in process.py and the os.path.normcase
        # lowercasing that keys workspace identity in jobs/sqlite_store.py.
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest -m "not integration" --cov=nexus_mcp --cov-report=term-missing --cov-report=xml -v
      - name: Check diff coverage
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: j7an/shared-workflows/actions/coverage@72948aa22854e8ae24a8e86ee72eb72ec954b71d # v4.7.3
        with:
          report-path: coverage.xml
          diff-cover-path: ${{ github.workspace }}/.venv/bin/diff-cover
          base-sha: ${{ github.event.pull_request.base.sha }}
          minimum: "90"
          source-paths: src/nexus_mcp/
          exclude-paths: src/nexus_mcp/__main__.py

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
      - name: Mypy
        run: uv run mypy src/nexus_mcp

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          # deny-licenses is deprecated upstream (actions/dependency-review-action#938) but
          # still functional in v5.0.0. Identifiers use ClearlyDefined's short SPDX forms
          # (the action's own examples use GPL-3.0 / LGPL-2.0). Revisit if removed in a future major.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
