name: Dependency Safety

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  issues: write

concurrency:
  group: dependency-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safety:
    # Real dependency-safety scan runs for Dependabot only; every other PR
    # (human fork, same-repo branch, other bot) gets the status-only gate in
    # dependency-safety-non-bot-gate.yml. `pull_request.user.login` is the
    # spoofing-resistant actor field.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: j7an/shared-workflows/.github/workflows/dependency-safety.yml@b04c3c5b042db88c78a52e789af8b4998c3fe593 # v4.3.0
    with:
      auto_merge: true
      release_age_policy: advisory
      minimum_release_age_days: 5
