name: Pre-commit Autoupdate

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pre-commit-autoupdate
  cancel-in-progress: true

jobs:
  autoupdate:
    permissions:
      contents: write
      pull-requests: write
    uses: j7an/shared-workflows/.github/workflows/pre-commit-autoupdate.yml@c53114483640d2432e6a205fa6bf394a93c295d7 # v4.5.0
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
